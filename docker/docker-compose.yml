services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=ingesoft2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ingesoft2"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Servicio Backend (Python/Flask)
  backend:
    build:
      context: ".."
      dockerfile: Dockerfile
    container_name: backend-flask
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/ingesoft2
    volumes:
      - backend_logs:/var/log/supervisor
      - backend_data:/app
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio Frontend (React/Vite)
  frontend:
    build:
      context: "../../Proyecto Front"
      dockerfile: Dockerfile
    container_name: frontend-react
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:5000
    volumes:
      - frontend_logs:/var/log/supervisor
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volúmenes para persistir logs y datos
volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  backend_data:
    driver: local
  frontend_logs:
    driver: local

# Red personalizada para comunicación entre contenedores
networks:
  app-network:
    driver: bridge
