name: Build and Push Backend Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mi-app-repo

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_${{ github.run_id }}
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      DATABASE_URL: postgresql://test_user:test_password_${{ github.run_id }}@localhost:5432/test_db
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize database schema
      run: |
        PGPASSWORD=test_password_${{ github.run_id }} psql -h localhost -U test_user -d test_db -f scripts/init.sql

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Run installation tests
      run: |
        python -c "import flask; print('Flask installed successfully')"
        python -c "import pytest; print('Pytest installed successfully')"
        python -c "from app import create_app; app = create_app(); print('Application creates successfully')"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest
        echo "image_tag=backend-$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "::notice::Image pushed to $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Get ECR Login Password
      id: ecr-login
      run: |
        echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        ECR_PASSWORD: ${{ steps.ecr-login.outputs.password }}
      with:
        host: ${{ secrets.EC2_BACKEND_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        envs: ECR_REGISTRY,ECR_PASSWORD,ECR_REPOSITORY,AWS_REGION
        script: |
          # Login to ECR
          echo $ECR_PASSWORD | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Stop and remove existing container
          docker stop backend-container 2>/dev/null || true
          docker rm backend-container 2>/dev/null || true
          
          # Pull latest image
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest
          
          # Run new container
          docker run -d \
            --name backend-container \
            --restart unless-stopped \
            -p 80:5000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest
          
          # Cleanup old images
          docker image prune -f
          
          echo "Backend deployed successfully!"
